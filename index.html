<title>AXIS FINANCE</title>
<style>
:root{--bg:#f6f5fa;--card:#fff;--tx:#17151f;--mu:#6b6880;--bd:#e7e4f0;--p:#7c3aed;--l:#ede9fe;--g:#16a34a;--r:#dc2626;--y:#d97706;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-t="light"]){--bg:#0d0c12;--card:#191822;--tx:#f3f2f8;--mu:#9b98b0;--bd:#2a2836;--l:#2e2450}}
:root[data-t="dark"]{--bg:#0d0c12;--card:#191822;--tx:#f3f2f8;--mu:#9b98b0;--bd:#2a2836;--l:#2e2450}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.45 Inter,system-ui,Segoe UI,sans-serif;display:flex;min-height:100vh}
aside{width:56px;background:var(--card);border-right:1px solid var(--bd);padding:8px 0;position:sticky;top:0;height:100vh;overflow:hidden;flex-shrink:0;transition:width .18s;cursor:pointer;z-index:5}aside.open{width:224px}.sp{flex:1}
nav a{display:flex;align-items:center;gap:14px;height:42px;padding:0 15px;color:var(--p);cursor:pointer;white-space:nowrap;font-weight:500;border-left:3px solid transparent}nav a span{opacity:0;transition:.15s;color:var(--tx)}aside.open nav a span{opacity:1}nav a svg{flex-shrink:0}
nav a:hover{background:var(--l)}nav a.on{background:var(--l);border-left-color:var(--p)}
main{flex:1;min-width:0;padding:0 26px 20px}.hdr{background:#4c1d95;color:#fff;margin:0 -26px 16px;padding:10px 26px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}.hdr img{height:40px;width:auto;display:block}.hdr select,.hdr input,.ib{background:#ffffff1f;border-color:#ffffff33;color:#fff}.hdr select option{color:#17151f}.hdr input::placeholder{color:#ffffffb0}#cfg{position:absolute;right:0;top:42px;background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:3px;padding:12px;width:190px;z-index:20;box-shadow:0 6px 20px #0003}#cfg button{width:100%;margin-top:6px}.qt{display:flex;background:#4a2f7c;margin-bottom:16px;flex-wrap:wrap}.qt a{flex:1;min-width:140px;padding:12px 16px;color:#fff;cursor:pointer;border-right:1px solid #ffffff22;font-weight:600}.qt a small{display:block;opacity:.7;font-size:10px;text-transform:uppercase;font-weight:400}.qt a:hover{background:#5b3d94}
.top{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:18px}
.top .sp{flex:1}
input,select,button{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:3px;padding:8px 12px}
button{cursor:pointer}button:disabled{opacity:.6;cursor:wait}.pri{background:var(--p);color:#fff;border-color:var(--p);font-weight:600}.sm{padding:3px 8px;font-size:12px;border-radius:3px}
h1{font-size:22px;margin:0}h2{font-size:15px;margin:0 0 12px}
.sub{color:var(--mu);margin:2px 0 0}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));margin-bottom:16px}
.g2{grid-template-columns:repeat(auto-fit,minmax(340px,1fr))}
.card{background:var(--card);border:1px solid var(--bd);border-radius:3px;padding:16px;box-shadow:0 1px 3px rgba(20,10,50,.05);animation:in .3s}
@keyframes in{from{opacity:0;transform:translateY(6px)}}
.k{color:var(--mu);font-size:12px;text-transform:uppercase;letter-spacing:.5px}.v{font-size:22px;font-weight:700;margin-top:4px}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--bd);white-space:nowrap}th{color:var(--mu);font-size:12px;font-weight:600}
.b{padding:2px 9px;border-radius:3px;font-size:11px;font-weight:600}
.b.g{background:#16a34a22;color:var(--g)}.b.r{background:#dc262622;color:var(--r)}.b.y{background:#d9770622;color:var(--y)}.b.p{background:var(--l);color:var(--p)}.b.x{background:var(--bd);color:var(--mu)}
.bar{display:flex;align-items:center;gap:8px;margin:6px 0;font-size:12px}.bar i{display:block;height:8px;border-radius:3px;background:var(--p)}.bar span{width:90px;color:var(--mu)}
.al{padding:9px 0;border-bottom:1px solid var(--bd);display:flex;justify-content:space-between;gap:10px}.al b{color:var(--r);font-size:16px}
.pos{color:var(--g)}.neg{color:var(--r)}.empty{text-align:center;color:var(--mu);padding:26px}
dialog{border:1px solid var(--bd);border-radius:3px;background:var(--card);color:var(--tx);padding:20px;width:min(420px,92vw)}
dialog::backdrop{background:#0008}dialog label{display:block;margin:8px 0 3px;color:var(--mu);font-size:12px}dialog input,dialog select{width:100%}
@media(max-width:800px){main{padding:0 12px 14px}.hdr{margin:0 -12px 14px;padding:10px 12px}.g2{grid-template-columns:1fr}}
#login{position:fixed;inset:0;background:linear-gradient(160deg,#4c1d95,#1e1040);display:flex;align-items:center;justify-content:center;z-index:100;padding:16px}
#login[hidden]{display:none}
#login form{background:var(--card);border-radius:6px;padding:28px;width:min(380px,100%);box-shadow:0 12px 40px #0006}
#login img{height:56px;display:block;margin:0 auto 20px;background:#4c1d95;padding:8px 14px;border-radius:4px}
#login label{display:block;margin:8px 0 3px;color:var(--mu);font-size:12px}#login input{width:100%}#login button{width:100%;margin-top:16px;padding:10px}
#lerr{color:var(--r);font-size:12px;min-height:18px;margin-top:10px;text-align:center}
</style>

const q_=async r=>{const x=await r;if(x.error)throw x.error;return x.data};

async function load(){
 const [a,b,c,d]=await Promise.all([DB.from('empresas').select('*').order('created_at'),DB.from('lancamentos').select('*'),DB.from('pagamentos').select('*').order('data'),DB.from('auditoria').select('*').order('created_at',{ascending:false}).limit(80)]);
 const er=[a,b,c,d].find(x=>x.error);if(er)throw er.error;
 const pm={};c.data.forEach(p=>(pm[p.lancamento_id]=pm[p.lancamento_id]||[]).push({d:p.data,v:+p.valor}));
 S.emps=a.data.map(e=>({id:e.id,nome:e.nome,saldo:+e.saldo}));
 S.tx=b.data.map(t=>({id:t.id,emp:t.empresa_id,tipo:t.tipo,desc:t.descricao,pessoa:t.pessoa||'-',cat:t.categoria,valor:+t.valor,venc:t.vencimento,c:t.cancelado,anexo:t.anexo_path,anexoNome:t.anexo_nome,pays:pm[t.id]||[]}));
 S.log=d.data.map(l=>({w:new Date(l.created_at).toLocaleString('pt-BR'),m:l.mensagem}));
 if(S.emp!='all'&&!S.emps.some(e=>e.id==S.emp))S.emp='all';ready=true}
async function run(fn){try{await fn();await load();go()}catch(e){alert('Erro: '+(e.message||e));return false}return true}
const pg=t=>t.pays.reduce((a,p)=>a+p.v,0),rem=t=>Math.max(0,t.valor-pg(t));

const L=()=>S.tx.filter(t=>S.emp=='all'||t.emp==S.emp);
const ativos=()=>L().filter(t=>!t.c);
const emps=()=>S.emps.filter(e=>S.emp=='all'||e.id==S.emp);
const en=id=>(S.emps.find(e=>e.id==id)||{}).nome||'-';
function rng(){const n=new Date(),y=n.getFullYear(),m=n.getMonth(),f=d=>d.toLocaleDateString('sv'),p=S.per;
 if(p=='hoje')return[T,T];if(p=='sem'){const a=new Date(n);a.setDate(n.getDate()-((n.getDay()+6)%7));return[f(a),add(0)]}
 if(p=='ant')return[f(new Date(y,m-1,1)),f(new Date(y,m,0))];if(p=='ano')return[y+'-01-01',y+'-12-31'];return[f(new Date(y,m,1)),f(new Date(y,m+1,0))]}
function real(tipo,[a,b]){let s=0;ativos().filter(t=>t.tipo==tipo).forEach(t=>t.pays.forEach(p=>{if(p.d>=a&&p.d<=b)s+=p.v}));return s}
function saldo(){let s=emps().reduce((a,e)=>a+e.saldo,0);ativos().forEach(t=>t.pays.forEach(p=>s+=t.tipo=='R'?p.v:-p.v));return s}
const sum=a=>a.reduce((x,t)=>x+rem(t),0),pend=(tp)=>ativos().filter(t=>t.tipo==tp&&rem(t)>0);

function bars(){const ms=[];for(let i=5;i>=0;i--)ms.push(new Date(new Date().getFullYear(),new Date().getMonth()-i,1).toLocaleDateString('sv').slice(0,7));
 let acc=emps().reduce((a,e)=>a+e.saldo,0);ativos().forEach(t=>t.pays.forEach(p=>{if(p.d.slice(0,7)<ms[0])acc+=t.tipo=='R'?p.v:-p.v}));
 const d=ms.map(m=>{let e=0,s=0;ativos().forEach(t=>t.pays.forEach(p=>{if(p.d.slice(0,7)==m)t.tipo=='R'?e+=p.v:s+=p.v}));acc+=e-s;return{m,e,s,sd:acc}});
 const mx=Math.max(1,...d.map(x=>Math.max(x.e,x.sd))),mn=Math.min(0,...d.map(x=>Math.min(x.sd,-x.s))),rg=mx-mn,y=v=>10+(mx-v)/rg*130;
 const grid=[0,1,2,3,4].map(i=>{const v=mx-rg*i/4;return`<line x1="46" x2="416" y1="${y(v)}" y2="${y(v)}" stroke="#8886" stroke-width=".5"/><text x="42" y="${y(v)+3}" text-anchor="end" font-size="9" fill="#8b88a0">${Math.round(v/1000)}k</text>`}).join('');
 const bs=d.map((x,i)=>{const X=58+i*60;return`<rect x="${X}" y="${y(x.e)}" width="34" height="${y(0)-y(x.e)}" fill="#22c55e"/><rect x="${X}" y="${y(0)}" width="34" height="${y(-x.s)-y(0)}" fill="#f97316"/><text x="${X+17}" y="160" text-anchor="middle" font-size="10" fill="#8b88a0">${x.m.slice(5)}/${x.m.slice(2,4)}</text>`}).join('');
 const ln=d.map((x,i)=>`${75+i*60},${y(x.sd)}`).join(' ');
 return`<svg viewBox="0 0 420 170" width="100%">${grid}${bs}<polyline points="${ln}" fill="none" stroke="#2563eb" stroke-width="2"/>${d.map((x,i)=>`<circle cx="${75+i*60}" cy="${y(x.sd)}" r="2.5" fill="#2563eb"/>`).join('')}</svg><div class="sub"><span style="color:#22c55e">&#9632;</span> Recebimentos &nbsp;<span style="color:#f97316">&#9632;</span> Pagamentos &nbsp;<span style="color:#2563eb">&#9632;</span> Saldo</div>`}
function catBars(){const m={};ativos().filter(t=>t.tipo=='D').forEach(t=>{const v=pg(t);if(v)m[t.cat]=(m[t.cat]||0)+v});const e=Object.entries(m).sort((a,b)=>b[1]-a[1]);const mx=e[0]?e[0][1]:1;
 return e.length?e.map(([c,v])=>`<div class="bar"><span>${c}</span><i style="width:${v/mx*55}%"></i>${brl(v)}</div>`).join(''):'<div class="empty">Sem gastos</div>'}
function table(rows,mode){const q=$('#q').value.toLowerCase();rows=rows.filter(t=>!q||(t.desc+t.pessoa+t.cat+t.valor).toLowerCase().includes(q)).sort((a,b)=>a.venc<b.venc?-1:1);
 if(!rows.length)return'<div class="empty">Nenhum registro encontrado.</div>';
 const A=rows.some(t=>t.tipo=='D');
 return`<div class="tw"><table><tr><th>${mode=='pago'?'Data':'Vencimento'}</th><th>Descrição</th><th>Pessoa</th><th>Categoria</th>${S.emp=='all'?'<th>Empresa</th>':''}<th>Valor</th><th>Status</th>${A?'<th>NF / Boleto</th>':''}<th></th></tr>${rows.map(t=>{const s=stat(t),last=t.pays.length?t.pays[t.pays.length-1].d:t.venc;
 return`<tr><td>${fd(mode=='pago'?last:t.venc)}</td><td>${esc(t.desc)}</td><td>${esc(t.pessoa)}</td><td>${t.cat}</td>${S.emp=='all'?`<td>${esc(en(t.emp))}</td>`:''}<td>${brl(mode=='pago'?pg(t):t.valor)}${mode!='pago'&&pg(t)?`<div class="sub">falta ${brl(rem(t))}</div>`:''}</td><td><span class="b ${s[1]}">${s[0]}</span></td>${A?`<td>${t.anexo?`<button class="sm" title="${esc(t.anexoNome||'')}" onclick="ver(${t.id})">📎 Ver</button>`:`<button class="sm" onclick="anexar(${t.id})">+ Anexar</button>`}</td>`:''}<td>${mode!='pago'&&!t.c&&rem(t)>0?`<button class="sm pri" onclick="pagar(${t.id})">${t.tipo=='D'?'Pagar':'Receber'}</button> `:''}${!t.c&&!(pg(t)>=t.valor)?`<button class="sm" onclick="canc(${t.id})">Cancelar</button>`:''}</td></tr>`}).join('')}</table></div>`}
function head(t,btn,fn){return`<div class="top"><div><h1>${t}</h1></div><span class="sp"></span><button class="pri" onclick="${fn}">${btn}</button></div>`}
const V={
dash(){const r=rng(),ent=real('R',r),sai=real('D',r),vd=pend('D').filter(t=>t.venc<T),h=pend('D').filter(t=>t.venc==T),p7=pend('D').filter(t=>t.venc>T&&t.venc<=add(7)),
 prox=pend('D').concat(pend('R')).sort((a,b)=>a.venc<b.venc?-1:1).slice(0,6),ult=ativos().flatMap(t=>t.pays.map(p=>({...p,t}))).sort((a,b)=>a.d<b.d?1:-1).slice(0,6);
 return`<div class="qt">${[['receber','Contas a Receber'],['pagar','Contas a Pagar'],['receitas','Receitas'],['gastos','Gastos'],['fluxo','Fluxo de Caixa']].map(x=>`<a onclick="S.view=\'${x[0]}\';go()"><small>Acesso</small>${x[1]}</a>`).join('')}</div><h1>Olá, gestor</h1><p class="sub">Visão financeira consolidada · ${S.emp=='all'?'Todas as empresas':esc(en(S.emp))}</p>
 <div class="top"><select onchange="S.per=this.value;go()">${[['hoje','Hoje'],['sem','Esta semana'],['mes','Este mês'],['ant','Mês anterior'],['ano','Este ano']].map(x=>`<option value="${x[0]}" ${S.per==x[0]?'selected':''}>${x[1]}</option>`).join('')}</select><span class="sp"></span>
 <button class="pri" onclick="novo('pagar')">+ Conta</button><button onclick="novo('gasto')">+ Gasto</button><button onclick="novo('receber')">+ Recebimento</button><button onclick="novo('receita')">+ Receita</button></div>
 <div class="grid">${cardk('Saldo atual',saldo())}${cardk('Entradas',ent,'pos')}${cardk('Saídas',sai,'neg')}${cardk('Contas a pagar',sum(pend('D')))}${cardk('Contas vencidas',sum(vd),'neg')}${cardk('Contas a receber',sum(pend('R')))}${cardk('Lucro do período',ent-sai,ent-sai>=0?'pos':'neg')}</div>
 <div class="grid g2"><div class="card"><h2>Fluxo de caixa (6 meses)</h2>${bars()}</div><div class="card"><h2>Gastos por categoria</h2>${catBars()}</div></div>
 <div class="grid g2"><div class="card"><h2>Alertas financeiros</h2><div class="al"><span>Contas vencidas (${brl(sum(vd))})</span><b>${vd.length}</b></div><div class="al"><span>Vencem hoje</span><b>${h.length}</b></div><div class="al"><span>Vencem em 7 dias</span><b>${p7.length}</b></div></div>
 <div class="card"><h2>Próximos vencimentos</h2><div class="tw"><table>${prox.map(t=>`<tr><td>${fd(t.venc)}</td><td>${esc(t.desc)}</td><td class="${t.tipo=='D'?'neg':'pos'}">${brl(rem(t))}</td></tr>`).join('')||'<tr><td class="empty">Nada pendente</td></tr>'}</table></div></div></div>
 <div class="card"><h2>Últimas movimentações</h2><div class="tw"><table>${ult.map(x=>`<tr><td>${fd(x.d)}</td><td>${esc(x.t.desc)}</td><td>${x.t.cat}</td><td class="${x.t.tipo=='D'?'neg':'pos'}">${x.t.tipo=='D'?'−':'+'}${brl(x.v)}</td></tr>`).join('')||'<tr><td class="empty">Sem movimentações</td></tr>'}</table></div></div>`},
pagar(){return head('Contas a Pagar','+ Nova conta a pagar',"novo('pagar')")+`<div class="card">${table(L().filter(t=>t.tipo=='D'&&(t.c||rem(t)>0)))}</div>`},
receber(){return head('Contas a Receber','+ Nova conta a receber',"novo('receber')")+`<div class="card">${table(L().filter(t=>t.tipo=='R'&&(t.c||rem(t)>0)))}</div>`},
gastos(){return head('Gastos','+ Novo gasto',"novo('gasto')")+`<div class="card">${table(ativos().filter(t=>t.tipo=='D'&&pg(t)>0),'pago')}</div>`},
receitas(){return head('Receitas','+ Nova receita',"novo('receita')")+`<div class="card">${table(ativos().filter(t=>t.tipo=='R'&&pg(t)>0),'pago')}</div>`},
fluxo(){const s=saldo();return`<h1>Fluxo de Caixa e Projeção</h1><p class="sub">Realizado (saldo atual) + previsto (contas pendentes)</p><br><div class="grid">${[7,15,30,60,90].map(n=>{const o=sum(pend('D').filter(t=>t.venc<=add(n))),i=sum(pend('R').filter(t=>t.venc<=add(n)));return`<div class="card"><div class="k">Em ${n} dias</div><div class="sub">Saldo atual ${brl(s)}</div><div class="neg">− ${brl(o)}</div><div class="pos">+ ${brl(i)}</div><div class="v">${brl(s-o+i)}</div></div>`}).join('')}</div><div class="card"><h2>Entradas x Saídas realizadas</h2>${bars()}</div>`},
dre(){const r=rng(),rb=real('R',r);let ded=0,cus=0,op=0;ativos().filter(t=>t.tipo=='D').forEach(t=>t.pays.forEach(p=>{if(p.d>=r[0]&&p.d<=r[1]){if(t.cat=='Impostos')ded+=p.v;else if(['Compras','Materiais','Fornecedores'].includes(t.cat))cus+=p.v;else op+=p.v}}));
 const rl=rb-ded,lb=rl-cus,res=lb-op,row=(a,b,c)=>`<tr><td ${c?'style="font-weight:700"':''}>${a}</td><td style="text-align:right;${c?'font-weight:700':''}">${brl(b)}</td></tr>`;
 return`<h1>DRE Gerencial / Lucro</h1><div class="top"><select onchange="S.per=this.value;go()">${[['mes','Este mês'],['ant','Mês anterior'],['ano','Este ano']].map(x=>`<option value="${x[0]}" ${S.per==x[0]?'selected':''}>${x[1]}</option>`).join('')}</select></div><div class="card"><table>${row('Receita bruta',rb,1)}${row('(−) Deduções (impostos)',ded)}${row('= Receita líquida',rl,1)}${row('(−) Custos',cus)}${row('= Lucro bruto',lb,1)}${row('(−) Despesas operacionais',op)}${row('= Resultado líquido',res,1)}</table><p class="sub">Margem líquida: ${rb?(res/rb*100).toFixed(1).replace('.',','):'0,0'}%</p></div>`},
emp(){return head('Empresas','+ Nova empresa',"novaEmp()")+`<div class="grid">${S.emps.map(e=>{const w=S.emp;S.emp=e.id;const s=saldo(),ent=real('R',rng()),sai=real('D',rng());S.emp=w;return`<div class="card"><h2>${esc(e.nome)}</h2><div class="k">Saldo</div><div class="v">${brl(s)}</div><div class="pos">Entradas: ${brl(ent)}</div><div class="neg">Saídas: ${brl(sai)}</div></div>`}).join('')||'<div class="card empty">Nenhuma empresa cadastrada. Clique em “+ Nova empresa”.</div>'}</div>`},
log(){return`<h1>Histórico / Auditoria</h1><br><div class="card">${S.log.map(l=>`<div class="al"><span>${l.w}</span><span>${esc(l.m)}</span></div>`).join('')||'<div class="empty">Sem registros ainda.</div>'}</div>`}};
function go(){$('#nav').innerHTML=`<a title="Menu" onclick="sb.classList.toggle('open')">${I('menu')}<span>Menu</span></a>`+NAV.map(n=>`<a title="${n[1]}" class="${S.view==n[0]?'on':''}" onclick="S.view='${n[0]}';go();sb.classList.remove('open')">${I(n[0])}<span>${n[1]}</span></a>`).join('');
 $('#emp').innerHTML='<option value="all">Todas as Empresas</option>'+S.emps.map(e=>`<option value="${e.id}" ${S.emp==e.id?'selected':''}>${esc(e.nome)}</option>`).join('');
 document.documentElement.dataset.t=S.theme;
 $('#app').innerHTML=ready?V[S.view]():`<div class="empty">${OK?'Carregando dados…':'Configure SUPABASE_URL e SUPABASE_KEY no topo do script para conectar ao banco.'}</div>`}
function tema(m){S.theme=m;cfg.hidden=true;go()}
/* ===== Anexos (NF / Boleto) no Supabase Storage ===== */
async function up(f,emp){if(f.size>10*1024*1024)throw new Error('Arquivo maior que 10 MB.');
 const nome=f.name.normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^\w.\-]/g,'_'),p=`${emp}/${Date.now()}_${nome}`;
 const r=await DB.storage.from(BUCKET).upload(p,f,{contentType:f.type||undefined});if(r.error)throw r.error;return p}
async function ver(id){const t=S.tx.find(x=>x.id==id),w=window.open('','_blank');
 const r=await DB.storage.from(BUCKET).createSignedUrl(t.anexo,300);
 if(r.error){if(w)w.close();return alert('Erro ao abrir anexo: '+r.error.message)}
 if(w)w.location=r.data.signedUrl;else location.href=r.data.signedUrl}
function anexar(id){const i=document.createElement('input');i.type='file';i.accept='.pdf,image/*';
 i.onchange=()=>{const f=i.files[0];if(f)run(async()=>{const t=S.tx.find(x=>x.id==id),p=await up(f,t.emp);
  await q_(DB.from('lancamentos').update({anexo_path:p,anexo_nome:f.name}).eq('id',id));await log(`Anexou "${f.name}" em "${t.desc}"`)})};i.click()}
/* ===== Lançamentos ===== */
function novo(m){if(!S.emps.length)return alert('Cadastre uma empresa primeiro (menu Empresas).');
 const D=m=='pagar'||m=='gasto',imm=m=='gasto'||m=='receita',cats=(D?CD:CR).map(c=>`<option>${c}</option>`).join('');
 $('#dc').innerHTML=`<h2>${{pagar:'Nova conta a pagar',gasto:'Novo gasto',receber:'Nova conta a receber',receita:'Nova receita'}[m]}</h2>
 <label>Empresa</label><select id="f0">${S.emps.map(e=>`<option value="${e.id}" ${S.emp==e.id?'selected':''}>${esc(e.nome)}</option>`).join('')}</select>
 <label>Descrição</label><input id="f1"><label>${D?'Fornecedor':'Cliente'}</label><input id="f2"><label>Categoria</label><select id="f3">${cats}</select>
 <label>Valor (R$)</label><input id="f4" type="number" step="0.01" min="0"><label>${imm?'Data':'Vencimento'}</label><input id="f5" type="date" value="${T}">
 ${D?'<label>Anexar NF ou Boleto (PDF ou imagem, até 10 MB)</label><input id="f6" type="file" accept=".pdf,image/*">':''}
 <div style="display:flex;gap:8px;margin-top:14px;justify-content:flex-end"><button onclick="dlg.close()">Voltar</button><button class="pri" onclick="salvar('${m}')">Salvar</button></div>`;dlg.showModal()}
async function salvar(m){const D=m=='pagar'||m=='gasto',imm=m=='gasto'||m=='receita',g=i=>$('#f'+i).value.trim(),v=parseFloat(g(4)),d=g(5);
 if(!g(1)||!(v>0)||!d)return alert('Preencha descrição, valor maior que zero e data.');
 const f=D?$('#f6').files[0]:null,b=event.target;b.disabled=true;
 const ok=await run(async()=>{const emp=g(0),p=f?await up(f,emp):null;
  const r=await q_(DB.from('lancamentos').insert({empresa_id:emp,tipo:D?'D':'R',descricao:g(1),pessoa:g(2)||'-',categoria:g(3),valor:v,vencimento:d,anexo_path:p,anexo_nome:f?f.name:null}).select('id').single());
  if(imm)await q_(DB.from('pagamentos').insert({lancamento_id:r.id,data:d,valor:v}));
  await log(`Criou ${m}: "${g(1)}" de ${brl(v)}${f?' (com anexo)':''}`)});
 if(ok)dlg.close();else b.disabled=false}
async function pagar(id){const t=S.tx.find(x=>x.id==id),a=prompt(`Valor ${t.tipo=='D'?'pago':'recebido'} (restante ${brl(rem(t))}):`,rem(t).toFixed(2));if(a===null)return;
 const v=parseFloat(String(a).replace(',','.'));if(!(v>0)||v>rem(t)+.005)return alert('Valor inválido.');
 run(async()=>{await q_(DB.from('pagamentos').insert({lancamento_id:id,data:T,valor:v}));await log(`Registrou ${t.tipo=='D'?'pagamento':'recebimento'} de ${brl(v)} em "${t.desc}"`)})}
function canc(id){const t=S.tx.find(x=>x.id==id);if(!confirm('Cancelar este lançamento? O histórico será mantido.'))return;
 run(async()=>{await q_(DB.from('lancamentos').update({cancelado:true}).eq('id',id));await log(`Cancelou "${t.desc}" (${brl(t.valor)})`)})}
function novaEmp(){const n=prompt('Razão social / nome da empresa:');if(!n||!n.trim())return;const s=parseFloat(String(prompt('Saldo inicial (R$):','0')).replace(',','.'))||0;
 run(async()=>{await q_(DB.from('empresas').insert({nome:n.trim(),saldo:s}));await log(`Criou a empresa "${n.trim()}"`)})}
const sb=$('#sb'),dlg=$('#dlg');go();
/* ===== Login (Supabase Auth) ===== */
$('#llogo').src=document.querySelector('.hdr img').src;
function telaLogin(msg){ready=false;S.emps=[];S.tx=[];S.log=[];$('#lp').value='';$('#lerr').textContent=msg||'';$('#login').hidden=false;go()}
function iniciar(){$('#login').hidden=true;go();load().then(go).catch(e=>{$('#app').innerHTML=`<div class="empty">Erro ao conectar ao Supabase: ${esc(e.message||e)}<br>Verifique se o script SQL foi executado.</div>`})}
async function doLogin(e){e.preventDefault();if(!OK){$('#lerr').textContent='Configure SUPABASE_URL e SUPABASE_KEY no script.';return false}
 const b=$('#lb');b.disabled=true;$('#lerr').textContent='';
 const r=await DB.auth.signInWithPassword({email:$('#le').value.trim(),password:$('#lp').value});
 b.disabled=false;if(r.error){$('#lerr').textContent='E-mail ou senha inválidos.';return false}
 iniciar();return false}
async function sair(){cfg.hidden=true;await DB.auth.signOut();telaLogin()}
(async()=>{if(!OK)return telaLogin('Configure SUPABASE_URL e SUPABASE_KEY no script.');
 const {data}=await DB.auth.getSession();data.session?iniciar():telaLogin();
 DB.auth.onAuthStateChange(ev=>{if(ev=='SIGNED_OUT')telaLogin()})})();
